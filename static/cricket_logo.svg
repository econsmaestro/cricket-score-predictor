<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100">
  <!-- Cricket ball (dark maroon, left-centre) -->
  <defs>
    <radialGradient id="ballGrad" cx="38%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#9b2335"/>
      <stop offset="100%" stop-color="#5c0a15"/>
    </radialGradient>
    <clipPath id="ballClip">
      <circle cx="45" cy="50" r="40"/>
    </clipPath>
  </defs>
  <circle cx="45" cy="50" r="40" fill="url(#ballGrad)"/>
  <!-- Seam lines -->
  <path d="M45 10 C25 25, 25 45, 45 50 C65 55, 65 75, 45 90" stroke="#7a0a1a" stroke-width="2" fill="none" stroke-linecap="round" clip-path="url(#ballClip)"/>
  <path d="M45 10 C65 25, 65 45, 45 50 C25 55, 25 75, 45 90" stroke="#7a0a1a" stroke-width="2" fill="none" stroke-linecap="round" clip-path="url(#ballClip)"/>
  <!-- Dark blue lightning bolt (right side, overlapping ball) -->
  <polygon points="72,8 52,52 67,52 48,95 90,42 73,42" fill="#0d2b6e" stroke="#0a2060" stroke-width="1" stroke-linejoin="round"/>
</svg>
