<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="ballGrad" cx="38%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#9b2335"/>
      <stop offset="100%" stop-color="#5c0a15"/>
    </radialGradient>
    <clipPath id="ballClip">
      <circle cx="42" cy="50" r="34"/>
    </clipPath>
  </defs>
  <!-- Cricket ball centred slightly left to leave room for bolt -->
  <circle cx="42" cy="50" r="34" fill="url(#ballGrad)"/>
  <!-- Seam lines -->
  <path d="M42 16 C24 29, 24 45, 42 50 C60 55, 60 71, 42 84" stroke="#7a0a1a" stroke-width="2" fill="none" stroke-linecap="round" clip-path="url(#ballClip)"/>
  <path d="M42 16 C60 29, 60 45, 42 50 C24 55, 24 71, 42 84" stroke="#7a0a1a" stroke-width="2" fill="none" stroke-linecap="round" clip-path="url(#ballClip)"/>
  <!-- Dark blue lightning bolt overlapping right side of ball -->
  <polygon points="64,10 46,50 59,50 42,90 80,44 66,44" fill="#0d2b6e" stroke="#0a2060" stroke-width="1" stroke-linejoin="round"/>
</svg>
