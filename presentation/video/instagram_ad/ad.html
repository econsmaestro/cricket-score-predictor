<!doctype html><html><head><meta charset="utf-8"><title>CricPredict Instagram ad (1080x1920)</title>
<style>
:root{--bg:#0B0F0D;--panel:#141A17;--green:#34C26B;--amber:#E0A93B;--mint:#8FD9AE;--muted:#A7B2AC;--text:#F4F7F5}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;width:1080px;height:1920px;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Inter,'Inter Display',Carlito,sans-serif;color:var(--text);
  background:radial-gradient(900px 700px at 85% 12%,rgba(52,194,107,.20),transparent 60%),radial-gradient(900px 800px at 0% 92%,rgba(224,169,59,.10),transparent 60%),var(--bg)}
.beat{position:absolute;inset:0;opacity:0}
.abs{position:absolute}
.ln{position:absolute;left:60px;width:960px;font-weight:900;line-height:.96;letter-spacing:-.02em;text-transform:uppercase;white-space:nowrap}
.w{display:inline-block;transform-origin:50% 80%}
.kick{position:absolute;left:60px;width:960px;font-weight:800;font-size:40px;letter-spacing:.14em;text-transform:uppercase;color:var(--green)}
.ui{position:absolute;left:90px;width:900px;overflow:hidden;border-radius:30px;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 2px rgba(255,255,255,.08);background:#fff}
.ui img{position:absolute;left:0;top:0;display:block;transform-origin:0 0}
.chip{position:absolute;left:60px;font-weight:800;font-size:44px;line-height:1;padding:20px 34px;border-radius:999px;border:4px solid;white-space:nowrap;text-transform:uppercase;letter-spacing:.04em}
.chip.amber{color:var(--amber);border-color:var(--amber);background:rgba(224,169,59,.14)}
.chip.green{color:var(--green);border-color:var(--green);background:rgba(52,194,107,.14)}
.chip.mint{color:var(--mint);border-color:var(--mint);background:rgba(143,217,174,.12)}
.brand{position:absolute;left:60px;top:252px;font-weight:800;font-size:34px;letter-spacing:.16em;color:var(--text);opacity:0}
.brand i{display:inline-block;width:18px;height:18px;border-radius:50%;background:var(--green);margin-right:14px;vertical-align:1px}
.stat{position:absolute;border-radius:30px;background:var(--panel);border:3px solid #22332B;padding:30px 36px}
.stat .l{font-size:34px;font-weight:800;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.stat .n{font-size:118px;font-weight:900;line-height:1;margin-top:14px;letter-spacing:-.03em}
.btn{position:absolute;left:140px;width:800px;height:150px;border-radius:999px;background:var(--green);color:#06210F;font-weight:900;font-size:66px;display:flex;align-items:center;justify-content:center;letter-spacing:.02em;text-transform:uppercase;box-shadow:0 24px 70px rgba(52,194,107,.45)}
.url{position:absolute;left:0;width:1080px;text-align:center;font-weight:900;white-space:nowrap;letter-spacing:-.025em}
</style></head><body><div id="stage"></div>
<script>
const B = 0.46875;                       // one beat at 128 BPM, seconds
const TL = [], HOOKS = [];
const stage = document.getElementById('stage');
const EASE = 'cubic-bezier(.16,.84,.24,1)', LIN = 'linear';
function an(el, kf, at, d, e) { const a = el.animate(kf, { duration: d * 1000, delay: at * 1000, easing: e || EASE, fill: 'both' }); a.pause(); TL.push(a); return a; }
function mk(cls, parent, html, style) { const e = document.createElement('div'); e.className = cls; if (html != null) e.innerHTML = html; if (style) Object.assign(e.style, style); (parent || stage).appendChild(e); return e; }
function beat(startB, lenB, build) {
  const s = startB * B, d = lenB * B, el = mk('beat', stage); if (startB > 0) el.style.top = '70px'; const ci = Math.min(.22, .24 / d), co = Math.min(.2, .2 / d);
  an(el, [{ opacity: 0, transform: 'translateY(70px) scale(.97)', easing: EASE }, { opacity: 1, transform: 'none', offset: ci }, { opacity: 1, transform: 'none', offset: 1 - co }, { opacity: 0, transform: 'translateY(-34px) scale(1.04)' }], s, d, LIN);
  build({ el, s, d });
}
// big uppercase words that pop in one by one
function words(c, lines, y, size, at, colors, gap) {
  let yy = y;
  lines.forEach((txt, i) => {
    const ln = mk('ln', c.el, '', { top: yy + 'px', fontSize: (Array.isArray(size) ? size[i] : size) + 'px', color: (colors && colors[i]) || 'var(--text)' });
    txt.split(' ').forEach((wd, k) => { const sp = mk('w', ln, wd + '&nbsp;'); sp.style.opacity = 0; an(sp, [{ opacity: 0, transform: 'translateY(40px) scale(.7)' }, { opacity: 1, transform: 'none' }], c.s + at + i * .09 + k * .07, .38); });
    yy += (Array.isArray(size) ? size[i] : size) * (gap || .98);
  });
  return yy;
}
function kicker(c, txt, y, at, color) { const k = mk('kick', c.el, txt, { top: y + 'px' }); if (color) k.style.color = color; k.style.opacity = 0; an(k, [{ opacity: 0, transform: 'translateX(-30px)' }, { opacity: 1, transform: 'none' }], c.s + (at || 0), .4); return k; }
// product screenshot in a rounded window; img displayed at width iw, offset (ix,iy); slow zoom z0->z1 about origin
function ui(c, src, o) {
  const w = mk('ui', c.el, '', { top: o.y + 'px', height: o.h + 'px', left: (o.x == null ? 90 : o.x) + 'px', width: (o.w || 900) + 'px', opacity: 0 });
  const im = document.createElement('img'); im.src = src; im.style.width = o.iw + 'px'; im.style.left = (o.ix || 0) + 'px'; im.style.top = (o.iy || 0) + 'px'; im.style.transformOrigin = o.org || '50% 0%'; w.appendChild(im);
  an(w, [{ opacity: 0, transform: 'translateY(160px) scale(.92)' }, { opacity: 1, transform: 'none' }], c.s + (o.at || .12), .55);
  an(im, [{ transform: 'scale(' + (o.z0 || 1) + ')' }, { transform: 'scale(' + (o.z1 || 1.1) + ')' }], c.s, c.d, LIN);
  if (o.pan) an(im, [{ top: (o.iy || 0) + 'px' }, { top: (o.iy || 0) + o.pan + 'px' }], c.s + (o.panAt || .5), c.d - (o.panAt || .5) - .3, 'cubic-bezier(.45,0,.25,1)');
  return w;
}
function chip(c, txt, cls, y, at, x) { const e = mk('chip ' + cls, c.el, txt, { top: y + 'px' }); if (x != null) e.style.left = x + 'px'; e.style.opacity = 0; an(e, [{ opacity: 0, transform: 'scale(.6)' }, { opacity: 1, transform: 'scale(1)' }], c.s + at, .4, 'cubic-bezier(.34,1.56,.64,1)'); an(e, [{ transform: 'scale(1)' }, { transform: 'scale(1.045)' }, { transform: 'scale(1)' }], c.s + at + .5, .9, 'ease-in-out'); return e; }
function counter(el, fmt, to, c, at, dur) { HOOKS.push(t => { const u = Math.max(0, Math.min(1, (t - (c.s + at)) / dur)), e = 1 - Math.pow(1 - u, 3); el.textContent = fmt(Math.round(to * e)); }); }
const SAMPLE = 'SAMPLE SCENARIO · NOT A REAL MATCH';

// persistent brand tag (scenes 2 to 4)
const brand = mk('brand', stage, '<i></i>CRICPREDICT'); an(brand, [{ opacity: 0 }, { opacity: .95, offset: .02 }, { opacity: .95, offset: .97 }, { opacity: 0 }], 7 * B, (55 - 7) * B, LIN);

/* 1. HOOK  (0 - 3.3 s) */
beat(0, 7, c => {
  words(c, ['THINK YOU', 'KNOW HOW AN', 'INNINGS', 'ENDS?'], 285, [124, 124, 124, 190], .0, [null, null, null, 'var(--green)'], .96);
  ui(c, 'assets/ui/banner_84.png', { y: 905, h: 534, iw: 900, at: .5, z0: 1, z1: 1.07 });
  chip(c, 'FINAL SCORE: ???', 'amber', 1462, 1.2, 60);
});
/* 2. LIVE PREDICTIONS  (3.3 - 10.8 s) */
beat(7, 4, c => {
  words(c, ['LIVE CRICKET.', 'LIVE PREDICTIONS.'], 340, [104, 104], .0, [null, 'var(--green)']);
  ui(c, 'assets/ui/live_home.png', { y: 640, h: 700, iw: 900, z0: 1, z1: 1.2, org: '12% 28%' });
  chip(c, 'TAP PREDICT ON ANY MATCH', 'green', 1400, .9, 60);
});
beat(11, 4, c => {
  words(c, ['PROJECTED', 'FINAL SCORE'], 340, [118, 118], .0, [null, 'var(--green)']);
  ui(c, 'assets/ui/score_199.png', { y: 720, h: 420, iw: 1250, ix: -175, iy: 10, z0: 1, z1: 1.08, org: '50% 40%' });
  chip(c, 'NZ v IND · 84/4 AFTER 17 OVERS', 'mint', 1230, .8, 60);
});
beat(15, 4, c => {
  words(c, ['WICKETS', 'TO FALL'], 340, [118, 118], .0, [null, 'var(--green)']);
  ui(c, 'assets/ui/odi1_wickets.png', { y: 680, h: 700, iw: 1000, ix: -50, z0: 1, z1: 1.08, org: '50% 6%' });
  chip(c, SAMPLE, 'amber', 1420, .8, 60).style.fontSize = '32px';
});
beat(19, 4, c => {
  words(c, ['WIN', 'PROBABILITY'], 340, [118, 118], .0, [null, 'var(--green)']);
  ui(c, 'assets/ui/odi2_score.png', { y: 680, h: 700, iw: 1000, ix: -50, z0: 1, z1: 1.08, org: '50% 6%' });
  chip(c, SAMPLE, 'amber', 1420, .8, 60).style.fontSize = '32px';
});
/* 3. NEW ZEALAND v INDIA  (10.8 - 19.2 s) */
beat(23, 4, c => {
  kicker(c, 'New Zealand v India · 1st ODI', 330, .0);
  words(c, ['84/4'], 390, [250], .1, ['var(--text)']);
  words(c, ['AFTER 17 OVERS'], 650, [78], .3, ['var(--mint)']);
  ui(c, 'assets/ui/banner_84.png', { y: 790, h: 534, iw: 900, at: .35, z0: 1, z1: 1.07 });
});
beat(27, 5, c => {
  kicker(c, 'CricPredict says', 330, .0, 'var(--green)');
  const n = mk('ln', c.el, '199/7', { top: '380px', fontSize: '270px', color: 'var(--green)' }); n.style.opacity = 0;
  an(n, [{ opacity: 0, transform: 'scale(.8)' }, { opacity: 1, transform: 'none' }], c.s + .15, .4);
  counter(n, v => v + '/7', 199, c, .15, .9);
  words(c, ['RANGE 170–228'], 670, [64], .5, ['var(--muted)']);
  ui(c, 'assets/ui/score_199.png', { y: 820, h: 400, iw: 1200, ix: -150, iy: 0, at: .5, z0: 1, z1: 1.07, org: '50% 40%' });
});
beat(32, 4, c => {
  kicker(c, 'The innings ended', 330, .0, 'var(--mint)');
  const a = mk('stat', c.el, '<div class="l">Predicted</div><div class="n">199/7</div>', { left: '60px', top: '440px', width: '450px' });
  const b = mk('stat', c.el, '<div class="l">Actual</div><div class="n" style="color:var(--mint)">185<div style="font-size:46px;letter-spacing:.04em;margin-top:2px">ALL OUT</div></div>', { left: '540px', top: '440px', width: '480px', borderColor: 'var(--mint)' });
  [[a, .15], [b, .45]].forEach(([e, t]) => { e.style.opacity = 0; an(e, [{ opacity: 0, transform: 'translateY(80px) scale(.9)' }, { opacity: 1, transform: 'none' }], c.s + t, .5); });
  words(c, ['14 RUNS OFF.'], 830, [130], .8, ['var(--text)']);
  words(c, ['FROM 84/4.'], 965, [130], 1.0, ['var(--green)']);
});
beat(36, 5, c => {
  kicker(c, 'Then it updated', 330, .0, 'var(--amber)');
  words(c, ['171/9 · 37.3 OV'], 395, [100], .1, ['var(--text)']);
  words(c, ['PREDICTS 183'], 510, [100], .3, ['var(--green)']);
  ui(c, 'assets/ui/score_183.png', { y: 690, h: 400, iw: 1200, ix: -150, iy: 0, at: .5, z0: 1, z1: 1.07, org: '50% 40%' });
  chip(c, 'FINISHED 185 · 2 RUNS OFF', 'mint', 1160, 1.3, 60);
  words(c, ['PREDICTIONS UPDATE', 'AS THE INNINGS UNFOLDS'], 1290, [54, 54], 1.7, ['var(--muted)', 'var(--muted)'], 1.15);
});
/* 4. MORE THAN FOLLOWING THE SCORE  (19.2 - 25.8 s) */
beat(41, 4, c => {
  words(c, ['MORE THAN', 'JUST', 'FOLLOWING', 'THE SCORE.'], 400, [160, 160, 160, 160], .0, [null, null, null, 'var(--green)'], .98);
});
beat(45, 3, c => {
  kicker(c, 'Ask', 330, .0, 'var(--green)');
  words(c, ['THIRD', 'UMPIRE AI'], 390, [150, 150], .1, [null, 'var(--green)']);
  ui(c, 'assets/ui/third_umpire_hero.png', { y: 820, h: 400, iw: 1500, ix: -300, iy: -55, at: .4, z0: 1, z1: 1.0 });
});
beat(48, 3, c => {
  words(c, ['NEXT OVER,', 'BALL BY BALL'], 340, [112, 112], .0, [null, 'var(--green)']);
  ui(c, 'assets/ui/odi1_nextover.png', { y: 650, h: 720, iw: 1000, ix: -50, z0: 1, z1: 1.08, org: '50% 5%' });
  chip(c, SAMPLE, 'amber', 1420, .7, 60).style.fontSize = '32px';
});
beat(51, 4, c => {
  words(c, ['BUILD YOUR', 'OWN MATCH'], 340, [118, 118], .0, [null, 'var(--green)']);
  ui(c, 'assets/ui/form_84.png', { y: 640, h: 720, iw: 900, z0: 1, z1: 1.0, org: '50% 0%', pan: -430, panAt: .7 });
});
/* 5. CALL TO ACTION  (25.8 - 30.9 s) */
beat(55, 11, c => {
  words(c, ['READY TO', 'PREDICT?'], 330, [190, 190], .0, [null, 'var(--green)']);
  const b = mk('btn', c.el, 'Try CricPredict &nbsp;▶', { top: '790px', opacity: 0 });
  an(b, [{ opacity: 0, transform: 'scale(.7)' }, { opacity: 1, transform: 'scale(1)' }], c.s + .9, .5, 'cubic-bezier(.34,1.56,.64,1)');
  an(b, [{ transform: 'scale(1)' }, { transform: 'scale(1.04)' }, { transform: 'scale(1)' }], c.s + 1.5, 1.0, 'ease-in-out');
  an(b, [{ transform: 'scale(1)' }, { transform: 'scale(1.04)' }, { transform: 'scale(1)' }], c.s + 2.6, 1.0, 'ease-in-out');
  const u = mk('url', c.el, 'cricket-score-predictor.com', { top: '1010px', fontSize: '71px', opacity: 0 });
  an(u, [{ opacity: 0, transform: 'translateY(50px)' }, { opacity: 1, transform: 'none' }], c.s + 1.3, .5);
  const ul = mk('abs', c.el, '', { left: '70px', top: '1105px', height: '10px', borderRadius: '5px', background: 'var(--green)', width: '0px' });
  an(ul, [{ width: '0px' }, { width: '940px' }], c.s + 1.7, .6);
  const s = mk('url', c.el, 'Live predictions · Win probability · Third Umpire AI', { top: '1160px', fontSize: '38px', fontWeight: 700, color: 'var(--mint)', opacity: 0, letterSpacing: '0' });
  an(s, [{ opacity: 0 }, { opacity: 1 }], c.s + 2.2, .5);
  const d = mk('url', c.el, 'For entertainment only. Not betting.', { top: '1232px', fontSize: '32px', fontWeight: 600, color: 'var(--muted)', opacity: 0, letterSpacing: '0' });
  an(d, [{ opacity: 0 }, { opacity: 1 }], c.s + 2.4, .5);
});
window.TOTAL = 66 * B;
window.seek = t => { TL.forEach(a => { a.currentTime = t * 1000; }); HOOKS.forEach(h => h(t)); };
window.ready = () => Promise.all([document.fonts.ready, ...[...document.images].map(i => i.complete ? 1 : new Promise(r => { i.onload = i.onerror = r; }))]);
</script></body></html>
