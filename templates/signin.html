{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-md-5 col-lg-4">
    <div class="card border-0 shadow-sm">
      <div class="card-body p-4 text-center">
        <h1 class="h4 fw-bold mb-1">Log in to CricPredict</h1>
        <p class="text-muted small mb-4">Choose how you'd like to continue.</p>
        {% if google_enabled %}
        <a href="{{ url_for('google_auth.login') }}" class="btn btn-outline-dark w-100 mb-2">
          <i class="bi bi-google me-2"></i>Continue with Google
        </a>
        {% endif %}
        <a href="{{ url_for('replit_auth.login') }}" class="btn btn-outline-secondary w-100">
          <i class="bi bi-box-arrow-in-right me-2"></i>Continue with Replit
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
